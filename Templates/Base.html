<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="/static/style/styles2.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-logo">DASHBOARD</a>
        
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/send-message" class="nav-link">
                    <img src="/static/images/alert.webp" class="nav-icon" alt="Alert"/>
                    <span>SEND-ALERT</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="/logout" class="nav-link logout-btn">
                    <img src="/static/images/logout.webp" class="nav-icon" alt="Logout"/>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </div>
</nav>

<main class="main-content">
    <div class="canvas">
        {% block content %} {% endblock %}
    </div>
</main>

</body>
</html>
