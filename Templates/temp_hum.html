{% extends 'Base.html' %}

{% block content %}
<h2>Real-Time Sensor Dashboard</h2>


<div style="display: flex; flex-wrap: wrap; gap: 30px; margin-top: 20px;">
    <!-- Temperature chart -->
    <div style="flex: 1; min-width: 400px; height: 400px;">
        <h3>Temperature Sensor Data</h3>
        <canvas id="tempChart"></canvas>
    </div>

    <!-- Humidity chart -->
    <div style="flex: 1; min-width: 400px; height: 400px;">
        <h3>Humidity Sensor Data</h3>
        <canvas id="humidityChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Temperature chart
    const tempCtx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(tempCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Temperature (°C)',
                data: [],
                borderColor: 'rgba(255, 159, 64, 1)',
                backgroundColor: 'rgba(255, 159, 64, 0.1)',
                tension: 0.2,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { title: { display: true, text: 'Time' } },
                y: { beginAtZero: false, title: { display: true, text: 'Temperature (°C)' } }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        title: (ctx) => `Time: ${ctx[0].label}`,
                        label: (ctx) => `Temperature: ${ctx.formattedValue} °C`
                    }
                }
            }
        }
    });

    // Humidity chart
    const humCtx = document.getElementById('humidityChart').getContext('2d');
    const humidityChart = new Chart(humCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Humidity (%)',
                data: [],
                borderColor: 'rgba(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.1)',
                tension: 0.2,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { title: { display: true, text: 'Time' } },
                y: { beginAtZero: true, title: { display: true, text: 'Humidity (%)' } }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        title: (ctx) => `Time: ${ctx[0].label}`,
                        label: (ctx) => `Humidity: ${ctx.formattedValue}%`
                    }
                }
            }
        }
    });

    const maxPoints = 20;

    // Fetch temperature data
    async function fetchTempData() {
        try {
            const response = await fetch('/temp_data');
            const json = await response.json();

            if (!json.error) {
                const time = json.timestamp;
                const value = parseFloat(json.value);

                if (!isNaN(value)) {
                    tempChart.data.labels.push(time);
                    tempChart.data.datasets[0].data.push(value);

                    if (tempChart.data.labels.length > maxPoints) {
                        tempChart.data.labels.shift();
                        tempChart.data.datasets[0].data.shift();
                    }

                    tempChart.update();
                }
            }
        } catch (error) {
            console.error("Error fetching temperature data:", error);
        }
    }

    // Fetch humidity data
    async function fetchHumidityData() {
        try {
            const response = await fetch('/humidity_data');
            const json = await response.json();

            if (!json.error) {
                const time = json.timestamp;
                const value = parseFloat(json.value);

                if (!isNaN(value)) {
                    humidityChart.data.labels.push(time);
                    humidityChart.data.datasets[0].data.push(value);

                    if (humidityChart.data.labels.length > maxPoints) {
                        humidityChart.data.labels.shift();
                        humidityChart.data.datasets[0].data.shift();
                    }

                    humidityChart.update();
                }
            }
        } catch (error) {
            console.error("Error fetching humidity data:", error);
        }
    }

    // Initial fetch and intervals
    fetchTempData();
    fetchHumidityData();
    setInterval(fetchTempData, 5000);
    setInterval(fetchHumidityData, 5000);
</script>
{% endblock %}
